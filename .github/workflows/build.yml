name: AERA 16 Builder

on:
  workflow_dispatch:
    inputs:
      TWPR_MANIFEST_URL:
        description: "AERA manifest url"
        required: true
        default: "https://github.com/AERA-Recovery/android_manifest"
      TWPR_MANIFEST_BRANCH:
        description: "AERA branch"
        required: true
        default: "aera-16.0"
      DEVICE_TREE_URL:
        description: "Device tree url"
        required: true
        default: "https://github.com/mxihan/android_device_meizu_meizu21Pro-AERA.git"
      DEVICE_TREE_BRANCH:
        description: "Device tree branch"
        required: true
        default: "aera-16.0"
      DEVICE_PATH:
        description: "Device path device/"
        required: true
        default: "meizu/meizu21Pro"
      DEVICE_NAME:
        description: "Device name"
        required: true
        default: "meizu21Pro"
      LUNCH_TARGET:
        description: "lunch twrp_ (default same as device name)"
        required: false
        default: ""
      RELEASE_NAME:
        description: "Release device name"
        required: false
        default: ""
      BUILD_PARTITION:
        description: "Build partition"
        required: true
        default: "recovery"

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - name: Show build info
      run: |
        echo "LUNCH_TARGET=${{ github.event.inputs.LUNCH_TARGET || github.event.inputs.DEVICE_NAME }}" >> "$GITHUB_ENV"
        echo "RELEASE_NAME=${{ github.event.inputs.RELEASE_NAME || github.event.inputs.DEVICE_NAME }}" >> "$GITHUB_ENV"
        {
          echo 'BUILD_INFO<<EOF'
          echo
          echo Manifest url: ${{ github.event.inputs.TWPR_MANIFEST_URL }}
          echo Manifest branch: ${{ github.event.inputs.TWPR_MANIFEST_BRANCH }}
          echo Device tree url: ${{ github.event.inputs.DEVICE_TREE_URL }}
          echo Device tree branch: ${{ github.event.inputs.DEVICE_TREE_BRANCH }}
          echo Device path: ${{ github.event.inputs.DEVICE_PATH }}
          echo Device name: ${{ github.event.inputs.DEVICE_NAME }}
          echo Lunch target: ${{ github.event.inputs.LUNCH_TARGET }}
          echo Build target: ${{ github.event.inputs.BUILD_PARTITION }}.img
          echo Build date: `date`
          echo
          echo EOF
        } >> "$GITHUB_ENV"
        echo BUILD_DATE=`date +%F` >> "$GITHUB_ENV"
        echo "REPO_NAME=$(basename ${{ github.event.inputs.TWPR_MANIFEST_URL }})" >> "$GITHUB_ENV"

    - name: Cleanup
      uses: rokibhasansagar/slimhub_actions@main

    - name: Maximize build space
      uses: easimon/maximize-build-space@master
      with:
        swap-size-mb: 16384
        remove-dotnet: 'true'
        remove-android: 'true'
        remove-haskell: 'true'

    - name: Setup ccache
      uses: hendrikmuhs/ccache-action@v1.2
      with:
        create-symlink: true

    - name: Setup zram (fallback to swap)
      run: |
        sudo apt install zram-tools -y || true
        if sudo modprobe zram 2>/dev/null; then
          echo "zram module loaded"
          sudo sed -i 's/^#PERCENT=50/PERCENT=90/' /etc/default/zramswap || true
          sudo sed -i 's/^#PRIORITY=100/PRIORITY=1000/' /etc/default/zramswap || true
          sudo systemctl restart zramswap || true
          zramctl || true
        else
          echo "zram not available, swap file already created by maximize-build-space"
        fi
        free -h

    - name: Setup environment
      run: |
        export DEBIAN_FRONTEND=noninteractive
        sudo apt update && sudo apt upgrade -y
        sudo apt install repo -y
        git config --global user.name ${{ github.actor }}
        git config --global user.email ${{ github.actor }}@users.noreply.github.com

    - name: Sync source
      run: |
        repo init -u ${{ github.event.inputs.TWPR_MANIFEST_URL }} -b ${{ github.event.inputs.TWPR_MANIFEST_BRANCH }} --depth=1
        (while true; do echo "Syncing source..."; sleep 60; done) &
        TIP_PID=$!
        repo sync
        kill $TIP_PID && exit 0

    - name: Setup device
      run: |
        git clone ${{ github.event.inputs.DEVICE_TREE_URL }} -b ${{ github.event.inputs.DEVICE_TREE_BRANCH }} device/${{ github.event.inputs.DEVICE_PATH }}

    - name: Apply recovery compatibility fixes
      env:
        DEVICE_TREE_PATH: device/${{ github.event.inputs.DEVICE_PATH }}
      run: |
        git -C bootable/recovery apply "$GITHUB_WORKSPACE/$DEVICE_TREE_PATH/patches/aera-core-fixes.patch"
        git -C external/lvgl apply "$GITHUB_WORKSPACE/$DEVICE_TREE_PATH/patches/lvgl-bounds-fix.patch"

    - name: Generate build info
      run: |
        echo -e "$BUILD_INFO" >> INFO.txt
        echo "Change log:" >> INFO.txt
        set +e
        LAST_TAG=$(git describe --tags --abbrev=0 2>/dev/null)
        if [ $? -eq 0 ]; then
          git log "$LAST_TAG"..HEAD --pretty=format:"- %h-%an: %s" >> INFO.txt
        else
          git log --pretty=format:"- %h-%an: %s" >> INFO.txt
        fi
        cat INFO.txt
      working-directory: device/${{ github.event.inputs.DEVICE_PATH }}

    - name: Build AERA
      run: |
        export AERA_BUILD_DEVICE=${{ github.event.inputs.DEVICE_NAME }}
        source build/envsetup.sh
        export ALLOW_MISSING_DEPENDENCIES=true
        export CCACHE_DIR=.ccache
        export CCACHE_EXEC=$(command -v ccache)
        export CCACHE_MAXSIZE=5G
        export USE_CCACHE=1
        lunch twrp_${{ env.LUNCH_TARGET }}-bp2a-eng
        export LC_ALL=C
        (while true; do echo `date +%T` "Building AERA..."; free -h; sleep 30; done) &
        TIP_PID=$!
        m -j3 ${{ github.event.inputs.BUILD_PARTITION }}image
        cp out/target/product/${{ github.event.inputs.DEVICE_NAME }}/${{ github.event.inputs.BUILD_PARTITION }}.img out/target/product/${{ github.event.inputs.DEVICE_NAME }}/AERA-Unofficial-${{ env.RELEASE_NAME }}-${{ env.BUILD_DATE }}.img
        kill $TIP_PID && exit 0

    - name: Upload to Release
      uses: softprops/action-gh-release@v2
      with:
        files: |
          out/target/product/${{ github.event.inputs.DEVICE_NAME }}/AERA-Unofficial-${{ env.RELEASE_NAME }}-${{ env.BUILD_DATE }}.img
        name: AERA-Unofficial-${{ env.RELEASE_NAME }}-${{ env.BUILD_DATE }}-${{ github.run_id }}
        tag_name: ${{ env.BUILD_DATE }}-${{ github.run_id }}
        body_path: device/${{ github.event.inputs.DEVICE_PATH }}/INFO.txt
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
